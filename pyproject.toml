[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-markets-arbitrage-scan"
version = "0.1.0"
description = "Dead-simple PMXT live matched-market price comparison across prediction market venues."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pmxt>=2.17.1",
    "websocket-client>=1.8",
]

[project.scripts]
pmxt-arb-scan = "pmxt_arb_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
